# Generated by corvidae's mirror transform (COR-1286). Do not edit by hand: a sync overwrites
# this file every run. Its operations come from verifyTarget's steps (src/verify-steps.ts
# in corvidae), rendered for this target's own CI so a pull request the mirror opens carries
# the same verification the sync already ran before opening it.
name: mirror-verify

on:
  pull_request:
  merge_group:
  workflow_call:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: install dependencies
        working-directory: .
        run: |
          bun install --frozen-lockfile --linker=isolated

      - name: Prepare mirror-verify scratch directories
        run: mkdir -p '${{ runner.temp }}/mirror-verify/tarballs' '${{ runner.temp }}/mirror-verify/consumer'

      - name: check that @lostgradient/weft exports its manifest version
        working-directory: packages/weft
        run: |
          bun -e 'const file = process.argv.at(-1); const { existsSync, readFileSync } = require("node:fs"); const { name, version } = JSON.parse(readFileSync("package.json", "utf8")); const remedy = "Run the mirror sync for this target, which rewrites the constant to the manifest version, or update the constant in the same commit as the version bump."; if (!existsSync(file)) { console.error(name + " declares " + file + " as its version constant, but it does not exist. " + remedy); process.exit(1); } const quote = String.fromCharCode(39); const shape = new RegExp("^[^]*?export const VERSION = " + quote + "([^" + quote + "]*)" + quote + ";" + String.fromCharCode(10) + "$"); const match = shape.exec(readFileSync(file, "utf8")); if (!match) { console.error(name + ": " + file + " is not shaped as export const VERSION = <version>; after an optional comment."); process.exit(1); } if (match[1] !== version) { console.error(name + " exports VERSION " + match[1] + " from " + file + ", but package.json is version " + version + ". " + remedy); process.exit(1); } console.log(name + " exports VERSION " + version + ", matching package.json");' src/version.ts

      - name: build @lostgradient/weft
        working-directory: packages/weft
        run: |
          bun run build

      - name: typecheck @lostgradient/weft
        working-directory: packages/weft
        run: |
          bun run typecheck

      - name: prepack @lostgradient/weft
        working-directory: packages/weft
        run: |
          bun run prepack

      - name: require @lostgradient/weft scripts/build-binary.test.ts
        working-directory: packages/weft
        run: |
          test -f scripts/build-binary.test.ts

      - name: require @lostgradient/weft scripts/build-binary-size.test.ts
        working-directory: packages/weft
        run: |
          test -f scripts/build-binary-size.test.ts

      - name: verify @lostgradient/weft binary payload
        working-directory: packages/weft
        run: |
          bun test scripts/build-binary.test.ts scripts/build-binary-size.test.ts

      - name: pack @lostgradient/weft
        working-directory: packages/weft
        run: |
          bun pm pack --ignore-scripts --quiet --destination ${{ runner.temp }}/mirror-verify/tarballs

      - name: move @lostgradient/weft's packed tarball into the shared tarballs directory
        working-directory: packages/weft
        run: |
          bun -e 'const [source, stem, destination] = process.argv.slice(-3); const { readFileSync, renameSync } = require("node:fs"); const { version } = JSON.parse(readFileSync("package.json", "utf8")); renameSync(require("node:path").join(source, stem + "-" + version + ".tgz"), destination);' ${{ runner.temp }}/mirror-verify/tarballs lostgradient-weft ${{ runner.temp }}/mirror-verify/tarballs/lostgradient-weft.tgz

      - name: check @lostgradient/weft's packed README
        working-directory: .
        run: |
          bun -e 'const tarball = process.argv.at(-1); const run = async (command) => { const child = Bun.spawn(command, {stdout: "pipe", stderr: "pipe"}); const [text, , status] = await Promise.all([new Response(child.stdout).text(), new Response(child.stderr).text(), child.exited]); return {text, status}; }; const listing = await run(["tar", "-tf", tarball]); const entries = listing.status === 0 ? listing.text.split(String.fromCharCode(10)).map(entry => entry.trim()) : []; const nested = entries.filter(entry => entry !== "package/README.md" && entry.toLowerCase().endsWith("/readme.md")).sort(); let result = entries.includes("package/README.md") ? {ok: true} : {ok: false, problem: {kind: "missing"}}; for (const path of result.ok ? ["package/README.md", ...nested] : []) { const file = await run(["tar", "-xOf", tarball, path]); if (file.status !== 0) { console.error("could not read " + path + " from " + tarball); process.exit(2); } const marker = ["workspace:*","Corvidae"].find(value => file.text.includes(value)); if (marker) { result = {ok: false, problem: {kind: "internal-marker", marker, path}}; break; } } console.log(JSON.stringify(result)); process.exit(result.ok ? 0 : 1);' ${{ runner.temp }}/mirror-verify/tarballs/lostgradient-weft.tgz

      - name: publint @lostgradient/weft
        working-directory: .
        run: |
          bunx --bun publint@0.3.24 --strict ${{ runner.temp }}/mirror-verify/tarballs/lostgradient-weft.tgz

      - name: check @lostgradient/weft's published types with attw
        working-directory: .
        run: |
          bunx --bun @arethetypeswrong/cli@0.18.5 ${{ runner.temp }}/mirror-verify/tarballs/lostgradient-weft.tgz --no-definitely-typed --format ascii --ignore-rules cjs-resolves-to-esm no-resolution

      - name: write the consumer smoke-test project (package.json, part 1)
        working-directory: ${{ runner.temp }}/mirror-verify/consumer
        run: |
          cat > package.json <<'MIRROR_VERIFY_EOF'
          {
            "name": "mirror-consumer-smoke-test",
            "version": "0.0.0",
            "private": true,
            "type": "module",
            "dependencies": {
              "@lostgradient/weft": "file:${{ runner.temp }}/mirror-verify/tarballs/lostgradient-weft.tgz"
            }
          }
          MIRROR_VERIFY_EOF

      - name: write the consumer smoke-test project (smoke.mjs, part 1)
        working-directory: ${{ runner.temp }}/mirror-verify/consumer
        run: |
          cat > smoke.mjs <<'MIRROR_VERIFY_EOF'
          import * as module0 from '@lostgradient/weft';
          import * as module1 from '@lostgradient/weft/a2a';
          import * as module2 from '@lostgradient/weft/storage';
          import * as module3 from '@lostgradient/weft/storage/bun-sqlite';
          import * as module4 from '@lostgradient/weft/storage/indexeddb';
          import * as module5 from '@lostgradient/weft/worker';
          import * as module6 from '@lostgradient/weft/worker/authoring';
          import * as module7 from '@lostgradient/weft/worker/generated-authoring';
          const loaded = [
            module0,
            module1,
            module2,
            module3,
            module4,
            module5,
            module6,
            module7
          ];
          const specifierNames = [
            "@lostgradient/weft",
            "@lostgradient/weft/a2a",
            "@lostgradient/weft/storage",
            "@lostgradient/weft/storage/bun-sqlite",
            "@lostgradient/weft/storage/indexeddb",
            "@lostgradient/weft/worker",
            "@lostgradient/weft/worker/authoring",
            "@lostgradient/weft/worker/generated-authoring"
          ];
          for (const [index, module] of loaded.entries()) {
            if (typeof module !== 'object' || module === null) {
              throw new Error(`${specifierNames[index]} did not resolve to a module`);
            }
          }
          MIRROR_VERIFY_EOF

      - name: write the consumer smoke-test project (smoke-node.mjs, part 1)
        working-directory: ${{ runner.temp }}/mirror-verify/consumer
        run: |
          cat > smoke-node.mjs <<'MIRROR_VERIFY_EOF'
          import * as module0 from '@lostgradient/weft';
          import * as module1 from '@lostgradient/weft/a2a';
          import * as module2 from '@lostgradient/weft/storage';
          import * as module3 from '@lostgradient/weft/storage/indexeddb';
          import * as module4 from '@lostgradient/weft/worker';
          import * as module5 from '@lostgradient/weft/worker/authoring';
          import * as module6 from '@lostgradient/weft/worker/generated-authoring';
          const loaded = [
            module0,
            module1,
            module2,
            module3,
            module4,
            module5,
            module6
          ];
          const specifierNames = [
            "@lostgradient/weft",
            "@lostgradient/weft/a2a",
            "@lostgradient/weft/storage",
            "@lostgradient/weft/storage/indexeddb",
            "@lostgradient/weft/worker",
            "@lostgradient/weft/worker/authoring",
            "@lostgradient/weft/worker/generated-authoring"
          ];
          for (const [index, module] of loaded.entries()) {
            if (typeof module !== 'object' || module === null) {
              throw new Error(`${specifierNames[index]} did not resolve to a module`);
            }
          }
          MIRROR_VERIFY_EOF

      - name: install the packed tarballs into the consumer project
        working-directory: ${{ runner.temp }}/mirror-verify/consumer
        run: |
          bun install --linker=isolated

      - name: import 8 specifier(s) from the packed tarballs
        working-directory: ${{ runner.temp }}/mirror-verify/consumer
        run: |
          bun run smoke.mjs

      - name: import 7 specifier(s) from the packed tarballs under node
        working-directory: ${{ runner.temp }}/mirror-verify/consumer
        run: |
          node smoke-node.mjs
