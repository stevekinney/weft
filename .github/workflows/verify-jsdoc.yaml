name: verify-jsdoc

on:
  pull_request:
    paths:
      - 'src/**'
      - 'README.md'
      - 'BREAKING-CHANGES.md'
      - 'AGENTS.md'
      - 'CLAUDE.md'
      - 'documentation/**'
      - 'reference/**'
      - 'src/server/__fixtures__/subscription-wire/README.md'
      - 'package.json'
      - 'scripts/lib/jsdoc-manifest.ts'
      - 'scripts/audit-jsdoc-manifest.ts'
      - 'scripts/build-jsdoc-manifest.ts'
      - 'scripts/check-declaration-jsdoc.ts'
      - 'scripts/verify-documentation.ts'
      - 'scripts/extract-doctests.ts'
      - 'scripts/extract-markdown-doctests.ts'
      - 'scripts/markdown-doctest-skip-counts.json'
      - 'scripts/markdown-doctest-skip-reasons.txt'
      - '.github/workflows/*.yaml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify documentation links and metadata
        run: bun run verify:documentation

      - name: Build package (so emitted .d.ts exists for audit + declaration checks)
        run: bun run build

      - name: Audit manifest (asserts public surface in sync; fails on missing JSDoc)
        run: bun run verify:jsdoc

      - name: Compile @example doctests
        run: bun run verify:jsdoc:doctests

      - name: Verify declaration JSDoc survives the re-export chain
        run: bun run verify:jsdoc:declarations

      - name: Verify markdown TypeScript doctests
        run: bun run verify:markdown-doctests
