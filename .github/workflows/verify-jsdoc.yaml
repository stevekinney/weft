name: verify-jsdoc

on:
  pull_request:
    paths:
      - 'packages/weft/src/**'
      - 'packages/weft/README.md'
      - 'packages/weft/BREAKING-CHANGES.md'
      - 'packages/weft/AGENTS.md'
      - 'packages/weft/CLAUDE.md'
      - 'packages/weft/documentation/**'
      - 'packages/weft/reference/**'
      - 'packages/weft/package.json'
      - 'packages/weft/scripts/lib/jsdoc-manifest.ts'
      - 'packages/weft/scripts/audit-jsdoc-manifest.ts'
      - 'packages/weft/scripts/build-jsdoc-manifest.ts'
      - 'packages/weft/scripts/check-declaration-jsdoc.ts'
      - 'packages/weft/scripts/verify-documentation.ts'
      - 'packages/weft/scripts/extract-doctests.ts'
      - 'packages/weft/scripts/extract-markdown-doctests.ts'
      - 'packages/weft/scripts/markdown-doctest-skip-counts.json'
      - 'packages/weft/scripts/markdown-doctest-skip-reasons.txt'
      - '.github/workflows/*.yaml'
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/weft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker=isolated
        working-directory: .

      - name: Verify documentation links and metadata
        run: bun run verify:documentation

      - name: Build package (so emitted .d.ts exists for audit + declaration checks)
        run: bun run build

      - name: Audit manifest (asserts public surface in sync; fails on missing JSDoc)
        run: bun run verify:jsdoc

      - name: Compile @example doctests
        run: bun run verify:jsdoc:doctests

      - name: Verify declaration JSDoc survives the re-export chain
        run: bun run verify:jsdoc:declarations

      - name: Verify markdown TypeScript doctests
        run: bun run verify:markdown-doctests
