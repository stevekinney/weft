name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run lint
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: |
          bun test --bail --timeout 15000 \
            --path-ignore-patterns '**/benchmarks/**' \
            --path-ignore-patterns 'src/dashboard/dashboard-serving.test.ts' \
            --path-ignore-patterns 'src/dashboard/svelte-test-harness.test-support.test.ts' \
            --path-ignore-patterns 'src/dashboard/fragments/workflow-execution-timeline.svelte.test.ts' \
            --path-ignore-patterns 'src/dashboard/fragments/schedule-list.test.ts' \
            --path-ignore-patterns 'src/dashboard/components/date-range-picker.svelte.test.ts' \
            --path-ignore-patterns 'src/dashboard/views/workflow-list.svelte.test.ts'
          bun test --bail --timeout 15000 --parallel=1 \
            src/dashboard/dashboard-serving.test.ts \
            src/dashboard/svelte-test-harness.test-support.test.ts \
            src/dashboard/fragments/workflow-execution-timeline.svelte.test.ts \
            src/dashboard/fragments/schedule-list.test.ts \
            src/dashboard/components/date-range-picker.svelte.test.ts \
            src/dashboard/views/workflow-list.svelte.test.ts
  service-worker-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bunx playwright install --with-deps chromium
      - run: bun run test:service-worker-browser
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build
  order-processing-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun install --frozen-lockfile
        working-directory: examples/order-processing
      - run: bun run verify
        working-directory: examples/order-processing
      - run: bun run smoke:server
        working-directory: examples/order-processing
