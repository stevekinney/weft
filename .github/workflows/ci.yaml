name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run lint
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: |
          bun test --bail --timeout 15000 \
            --path-ignore-patterns '**/benchmarks/**' \
            --path-ignore-patterns 'examples/checkout/**' \
            --path-ignore-patterns 'src/service-worker/service-worker-browser.test.ts' \
            --path-ignore-patterns 'src/storage/indexeddb-browser.test.ts' \
            --path-ignore-patterns 'src/storage/web-extension-browser.test.ts'
  # Exercises PostgresStorage against a REAL Postgres over the pg wire protocol
  # (TCP, BYTEA marshalling, command-tag rowCounts, SERIALIZABLE conflict retries).
  # The main `test` job runs the hermetic PGlite-backed conformance; this job lights
  # up the `WEFT_TEST_POSTGRES_URL`-gated live suite so the native driver path is
  # covered on every PR without external infra.
  postgres-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun test src/storage/postgres.test.ts --timeout 15000
        env:
          WEFT_TEST_POSTGRES_URL: postgresql://postgres:postgres@localhost:5432/postgres
  # Real-browser smoke tests (IndexedDB durability, Service Worker runtime,
  # WebExtension storage) run here against Playwright's pinned Chromium.
  # This is now a required blocking gate (continue-on-error removed), which
  # starts the real-CI bake. The browser surfaces stay EXPERIMENTAL and only
  # graduate to the stable tier once this gate has been reliably green across
  # real CI runs — see the "browser-surface promotion gate" in
  # documentation/roadmap-to-1.0.md.
  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      # Cache Playwright's pinned browser binary (keyed on the lockfile, which
      # pins the playwright version). The Linux system libraries are NOT stored
      # under ~/.cache/ms-playwright, so they are (re)installed on every run via
      # `install-deps`; only the multi-hundred-MB browser download is cached.
      - uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - run: exit 1 # WFT-75 disposable required-check proof
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build
  order-processing-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun install --frozen-lockfile
        working-directory: examples/order-processing
      - run: bun run verify
        working-directory: examples/order-processing
      - run: bun run smoke:server
        working-directory: examples/order-processing
  checkout-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun install --frozen-lockfile
        working-directory: examples/checkout
      - run: bun run verify
        working-directory: examples/checkout
  hello-world-example:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun install --frozen-lockfile
        working-directory: examples/hello-world
      - run: bun run verify
        working-directory: examples/hello-world
