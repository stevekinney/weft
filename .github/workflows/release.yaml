name: release

# `v*.*.*` tags publish @lostgradient/weft from packages/weft. The npm
# trusted publisher for @lostgradient/weft is configured against this
# repository and this workflow file (release.yaml) — keep both stable.
#
# @lostgradient/weft-ui is not published yet. When it ships, give it its own
# tag scheme (for example weft-ui@v*.*.*) and publish job; its first publish
# must happen manually (npm requires an existing package before a trusted
# publisher can be configured), after which a trusted publisher can be added
# for this workflow.
on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/weft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - name: Verify tag, package.json, and VERSION agree
        run: bun run scripts/verify-release-version.ts

  # The PR-time CI workflow (ci.yaml) does not run on tag pushes, so a tag could
  # otherwise publish code that never had lint/typecheck/tests run against it.
  # Run the full validate suite here as a hard gate that publish-npm depends on.
  validate:
    runs-on: ubuntu-latest
    # WFT-82: serialize JSC marking for the full-suite test process so a
    # runtime teardown crash cannot strand an already-pushed release tag.
    env:
      BUN_JSC_numberOfGCMarkers: '1'
    defaults:
      run:
        working-directory: packages/weft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker=isolated
        working-directory: .

      - name: Run lint, typecheck, and tests
        run: bun run validate

  # Coverage blocks tagged publication, but remains outside `prepack`: prepack
  # validates package construction and consumers, while this repository-wide
  # instrumentation pass is an independent release policy gate. The validate
  # job still runs ordinary tests, including timing-sensitive cases that skip
  # themselves only under coverage instrumentation.
  coverage:
    runs-on: ubuntu-latest
    # Apply the same JSC teardown mitigation as pull request coverage (WFT-82).
    env:
      BUN_JSC_numberOfGCMarkers: '1'
    defaults:
      run:
        working-directory: packages/weft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker=isolated
        working-directory: .

      - name: Run adjusted coverage gate
        run: bun run test:coverage

  publish-npm:
    needs: [verify, validate, coverage]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/weft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure npm for trusted publishing
        shell: bash
        run: |
          echo "NPM_CONFIG_USERCONFIG=$HOME/.npmrc" >> "$GITHUB_ENV"
          cat > "$HOME/.npmrc" <<'EOF'
          registry=https://registry.npmjs.org/
          always-auth=false
          EOF

      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker=isolated
        working-directory: .

      - name: Verify tag, package.json, and VERSION agree
        run: bun run scripts/verify-release-version.ts

      - name: Run package prepack gates
        run: bun run prepack

      - name: Verify npm publish dry run
        run: npm publish --dry-run --ignore-scripts

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: npm publish --ignore-scripts
