name: release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Verify tag, package.json, and VERSION agree
        run: bun run scripts/verify-release-version.ts

  # The PR-time CI workflow (ci.yaml) does not run on tag pushes, so a tag could
  # otherwise publish code that never had lint/typecheck/tests run against it.
  # Run the full validate suite here as a hard gate that publish-npm depends on.
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run lint, typecheck, and tests
        run: bun run validate

  publish-npm:
    needs: [verify, validate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Configure npm for trusted publishing
        shell: bash
        run: |
          echo "NPM_CONFIG_USERCONFIG=$HOME/.npmrc" >> "$GITHUB_ENV"
          cat > "$HOME/.npmrc" <<'EOF'
          registry=https://registry.npmjs.org/
          always-auth=false
          EOF

      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag, package.json, and VERSION agree
        run: bun run scripts/verify-release-version.ts

      - name: Run package prepack gates
        run: bun run prepack

      - name: Verify npm publish dry run
        run: npm publish --dry-run --ignore-scripts

      - name: Publish to npm
        env:
          NPM_CONFIG_PROVENANCE: 'true'
        run: npm publish --ignore-scripts

  notify-downstream-repositories:
    needs: publish-npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout release history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Open downstream bump issues
        env:
          GH_TOKEN: ${{ secrets.DOWNSTREAM_ISSUE_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_TAG_URL: https://github.com/${{ github.repository }}/tree/${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "${GH_TOKEN:-}" ]]; then
            echo "The DOWNSTREAM_ISSUE_TOKEN secret is required to open issues in downstream repositories." >&2
            exit 1
          fi

          weft_version="${RELEASE_TAG#v}"
          issue_title="Bump @lostgradient/weft to ${weft_version}"
          previous_release_tag=$(
            git tag --list 'v*.*.*' --sort=v:refname \
              | awk -v current="$RELEASE_TAG" '
                  $0 == current { print previous; exit }
                  { previous = $0 }
                '
          )
          changes_file=$(mktemp)

          if [[ -z "$previous_release_tag" ]]; then
            cat > "$changes_file" <<EOF
          - No previous release tag was found.
          EOF
          else
            git log --pretty=tformat:'- %s (%h)' "${previous_release_tag}..${RELEASE_TAG}" > "$changes_file"

            if [[ ! -s "$changes_file" ]]; then
              cat > "$changes_file" <<EOF
          - No commits were found between \`${previous_release_tag}\` and \`${RELEASE_TAG}\`.
          EOF
            else
              total_changes=$(git rev-list --count "${previous_release_tag}..${RELEASE_TAG}")

              if (( total_changes > 50 )); then
                truncated_changes_file=$(mktemp)
                {
                  head -n 50 "$changes_file"
                  echo "- ...and $((total_changes - 50)) more commits."
                } > "$truncated_changes_file"
                mv "$truncated_changes_file" "$changes_file"
              fi
            fi
          fi

          target_repositories_file=$(mktemp)
          python3 <<'PY' > "$target_repositories_file"
          import sys
          import tomllib

          with open("downstream-release-repositories.toml", "rb") as configuration_file:
              configuration = tomllib.load(configuration_file)

          repositories = configuration.get("repositories", [])
          if not repositories:
              sys.exit("downstream-release-repositories.toml must define at least one repository")

          for repository in repositories:
              owner = repository.get("owner")
              name = repository.get("name")
              if not isinstance(owner, str) or not owner.strip():
                  sys.exit("Each downstream release repository must define a non-empty owner")
              if not isinstance(name, str) or not name.strip():
                  sys.exit("Each downstream release repository must define a non-empty name")
              print(f"{owner}/{name}")
          PY
          mapfile -t target_repositories < "$target_repositories_file"
          rm "$target_repositories_file"

          if [[ ${#target_repositories[@]} -eq 0 ]]; then
            echo "downstream-release-repositories.toml must define at least one repository" >&2
            exit 1
          fi

          for target_repository in "${target_repositories[@]}"; do
            if [[ "$target_repository" != */* ]]; then
              echo "Invalid downstream repository: ${target_repository}" >&2
              exit 1
            fi
          done

          for target_repository in "${target_repositories[@]}"; do
            existing_issue_number=$(
              ISSUE_TITLE="$issue_title" gh search issues "$issue_title" \
                --repo "$target_repository" \
                --match title \
                --limit 100 \
                --json number,title \
                --jq 'map(select(.title == env.ISSUE_TITLE)) | .[0].number // ""'
            )

            if [[ -n "$existing_issue_number" ]]; then
              echo "Issue #${existing_issue_number} already exists in ${target_repository}; skipping."
              continue
            fi

            body_file=$(mktemp)
            {
              cat <<EOF
          A new \`@lostgradient/weft\` release is available.

          - Version: \`${weft_version}\`
          - Tag: ${RELEASE_TAG_URL}
          - Package: https://www.npmjs.com/package/@lostgradient/weft/v/${weft_version}

          Recent changes since ${previous_release_tag:-the previous release}:

          EOF
              cat "$changes_file"
              printf '\n\n'
              cat <<EOF
          Please update this repository to use \`@lostgradient/weft@${weft_version}\` and run its verification gates.
          EOF
            } > "$body_file"

            gh issue create \
              --repo "$target_repository" \
              --title "$issue_title" \
              --body-file "$body_file"

            rm "$body_file"
          done

          rm "$changes_file"
