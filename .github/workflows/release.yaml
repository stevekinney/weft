name: release

# Every push to main runs changesets/action. While changesets are pending it opens or updates the
# "Version Packages" pull request; once that pull request merges, release:publish publishes
# @lostgradient/weft from packages/weft if npm does not have the version yet, then tags it. A push
# that changes no version publishes nothing. The npm trusted publisher for @lostgradient/weft is
# configured against this repository and this workflow file (release.yaml) — keep both stable.
on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      snapshot:
        description: Publish an opt-in prerelease to npm's next dist-tag
        type: boolean
        required: true
        default: false
      expected_sha:
        description: Exact commit SHA verified by the mirror sync
        type: string
        required: false
        default: ""

permissions:
  contents: read

# Releases must not overlap: two runs would race on the Version Packages branch and on the registry.
# GitHub keeps only one pending run per group unless the queue is raised, and a newer push would
# cancel the pending run for the Version Packages merge. `queue: max` keeps up to 100 pending runs,
# roughly first in, first out, and runs are never cancelled (the default for cancel-in-progress,
# which cannot be combined with a queue). release:publish also refuses to publish from a commit
# that did not set the manifest version. If a run for a bump commit was lost anyway, re-run that
# commit's release run from the Actions UI; a re-run uses its original commit.
concurrency:
  group: release-${{ github.ref }}
  queue: max

jobs:
  verify:
    if: github.event_name == 'push' || inputs.snapshot
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/weft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - name: Verify package.json and VERSION agree
        if: github.event_name == 'push'
        run: bun run scripts/verify-release-version.ts

      - name: Prepare and verify snapshot ref
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bun run scripts/prepare-snapshot.ts

  # The same verification a pull request gets, called rather than restated: mirror-verify.yaml is
  # emitted by the corvidae mirror transform from the steps its own sync runs (install, build,
  # typecheck, pack, publint, attw, consumer smoke test). Lint, tests and coverage run in corvidae,
  # the source of truth, before a sync ever reaches this repository (COR-1286).
  verify-mirror:
    if: github.event_name == 'push' || inputs.snapshot
    uses: ./.github/workflows/mirror-verify.yaml

  # Every push to main first publishes any version npm does not have yet; only then does the
  # version-pull-request job let changesets/action open or update the "Version Packages" pull
  # request if changesets are pending. The order matters: changesets/action v2 runs its publish
  # script only when no changesets are pending, so a changeset landing before an already-bumped version published would otherwise
  # leave that version unpublished and untagged. release:publish asks npm first, so a push that
  # changes no version publishes nothing. It uses the OIDC trusted publishing and provenance setup
  # the tag-triggered publish job had; there is no NPM_TOKEN, because its presence can suppress OIDC.
  release:
    if: github.event_name == 'push'
    needs: [verify, verify-mirror]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Configure npm for trusted publishing
        shell: bash
        run: |
          echo "NPM_CONFIG_USERCONFIG=$HOME/.npmrc" >> "$GITHUB_ENV"
          cat > "$HOME/.npmrc" <<'EOF'
          registry=https://registry.npmjs.org/
          always-auth=false
          EOF

      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker=isolated

      # Publishes the manifest version when npm lacks it, then creates and pushes the annotated
      # v<version> tag on the commit that published; otherwise skips, and heals or verifies the tag.
      - name: Publish unpublished version
        run: bun run release:publish
        env:
          NPM_CONFIG_PROVENANCE: "true"

  # Kept out of the release job so this third-party action never holds npm's trusted-publishing
  # OIDC permission: it only opens or updates a pull request, so it gets no id-token at all.
  version-pull-request:
    if: github.event_name == 'push'
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker=isolated

      - name: Create or update Version Packages pull request
        uses: changesets/action@v2.1.2
        with:
          version-script: bun run changeset:version
          pr-title: Version Packages
          commit-message: Version Packages
          create-github-releases: false
          # release:publish creates the tag itself, so the action must not tag as well.
          push-git-tags: false
          github-token: ${{ secrets.GITHUB_TOKEN }}

  publish-npm:
    if: github.event_name == 'workflow_dispatch' && inputs.snapshot
    needs: [verify, verify-mirror]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: packages/weft
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Configure npm for trusted publishing
        shell: bash
        run: |
          echo "NPM_CONFIG_USERCONFIG=$HOME/.npmrc" >> "$GITHUB_ENV"
          cat > "$HOME/.npmrc" <<'EOF'
          registry=https://registry.npmjs.org/
          always-auth=false
          EOF

      - name: Upgrade npm
        run: npm install -g npm@11.5.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@v1
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile --linker=isolated
        working-directory: .

      - name: Prepare snapshot version
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        env:
          DISPATCH_ACTOR: ${{ github.actor }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          DISPATCH_SHA: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        run: bun run scripts/prepare-snapshot.ts

      - name: Run package prepack gates
        run: bun run prepack

      - name: Verify npm snapshot publish dry run
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        run: npm publish --dry-run --ignore-scripts --tag=next

      - name: Publish snapshot to npm next dist-tag
        if: github.event_name == 'workflow_dispatch' && inputs.snapshot
        env:
          NPM_CONFIG_PROVENANCE: "true"
        run: npm publish --ignore-scripts --tag=next
