name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - run: bun run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - run: bun run typecheck

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - run: bun run format:check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - run: bun run test

  # `bun run build` chains `vite build` with the bundle-size budget gate
  # (`bun run check:bundle`, scripts/check-bundle-size.ts) — one command, so
  # CI doesn't duplicate the budget check the package.json script already
  # composes.
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - run: bun run build

  # Deterministic adjusted-coverage gate (docs/implementation-plan.md §11,
  # scripts/check-coverage.ts): runs its own `bun run test:coverage` pass and
  # fails if that run fails/crashes or if any area's line/function coverage
  # drops below the floor recorded in scripts/coverage-baseline.ts. This is a
  # ratchet against the recorded baseline, not a 100%-coverage requirement —
  # see that file's doc comment for the target and the known provisional gap.
  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - run: bun run check:coverage
      # Uploaded unconditionally so a baseline re-measurement (raising the
      # Linux floor in scripts/coverage-baseline.ts) always has exact
      # hit/found integers to read, rather than reconstructing them from the
      # step log's printed percentages (see WFC-10 PR #14 review — this gap
      # is exactly what previously forced a laborious reconstruction for the
      # `src/routes/schedules` Linux fix, WFC-5 PR #12 commit a7d6603).
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-lcov-linux
          path: coverage/lcov.info
          retention-days: 14

  # Wired defensively: `tests/e2e/` is built by a parallel track (plan §11.4).
  # The `test:e2e` script check keeps this job a no-op (not a failure) on any
  # commit where that script isn't in package.json yet, and a real Playwright
  # run once it lands — no coordination needed to land this workflow first.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0
      - run: bun ci
      - name: Check for a test:e2e script
        id: check-e2e-script
        run: |
          if jq -e '.scripts["test:e2e"] != null' package.json > /dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      # Cache Playwright's pinned Chromium binary (keyed on the lockfile,
      # which pins the playwright version), mirroring the weft repo's
      # browser-smoke job. Linux system libraries aren't stored under
      # ~/.cache/ms-playwright, so they're (re)installed every run via
      # `install-deps`; only the multi-hundred-MB browser download is cached.
      - uses: actions/cache@v4
        if: steps.check-e2e-script.outputs.exists == 'true'
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: |
            playwright-chromium-${{ runner.os }}-
      - name: Install Playwright Chromium (+ system deps)
        if: steps.check-e2e-script.outputs.exists == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        run: bunx playwright install --with-deps chromium
      - name: Install Playwright system deps only (browser cached)
        if: steps.check-e2e-script.outputs.exists == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        run: bunx playwright install-deps chromium
      - name: Run E2E flows
        if: steps.check-e2e-script.outputs.exists == 'true'
        run: bun run test:e2e
      - name: Skip (no test:e2e script yet)
        if: steps.check-e2e-script.outputs.exists != 'true'
        run: echo "No 'test:e2e' script in package.json yet — skipping."
